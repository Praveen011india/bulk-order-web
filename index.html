<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BulkOrderBuddy Dashboard</title>
    <style>
        body { font-family: system-ui; background: #0f111a; color: #fff; padding: 40px; }
        .upload-box { border: 2px dashed #334155; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: left; }
        button { background: #f90; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="header">
        <h2>Bulk Order Dashboard</h2>
        <div id="user-button"></div>
    </div>

    <!-- Clerk Login Screen -->
    <div id="auth-container" style="display: flex; justify-content: center; margin-top: 50px;"></div>

    <!-- Main Dashboard (Hidden until login) -->
    <div id="dashboard-content" style="display: none;">
        <div class="upload-box">
            <p>Upload CSV File (Format: ASIN, Quantity)</p>
            <input type="file" id="csv-file" accept=".csv">
        </div>
        <button id="process-btn" style="display: none;">Sync Orders to Database</button>

        <h3 style="margin-top: 40px;">Live Order Tracking</h3>
        <table id="order-table">
            <thead>
                <tr>
                    <th>ASIN</th>
                    <th>Quantity</th>
                    <th>Live Status</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
