<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkOrderBuddy | Enterprise</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] },
                    colors: {
                        royal: { 900: '#0f0c29', 800: '#302b63', 700: '#24243e' },
                        gold: { 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0c29; }
        ::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 4px; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    </style>
</head>
<body class="bg-royal-900 text-slate-200 font-sans min-h-screen flex flex-col antialiased">

    <!-- LANDING PAGE VIEW -->
    <div id="landing-view" class="flex-grow flex flex-col relative z-10">
        <nav class="glass-card border-b border-white/10 px-6 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="text-2xl font-serif font-bold text-gold-400">BulkOrderBuddy</div>
            </div>
        </nav>

        <main class="flex-grow flex items-center py-20 px-6">
            <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                <div class="space-y-8">
                    <h1 class="text-5xl md:text-7xl font-serif font-black leading-tight text-white">Rule Your <br><span class="text-gold-500">E-Commerce Empire</span></h1>
                    <p class="text-lg text-slate-300">Ascend to the throne of modern retail. Deploy your automated bot fleet across Amazon, Flipkart, and Shopsy.</p>
                </div>

                <div class="glass-panel rounded-2xl p-8 lg:p-10 w-full max-w-md mx-auto">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-serif font-bold text-white mb-2">Access Dashboard</h2>
                        <p class="text-sm text-slate-400">Sign in to your authorized merchant account</p>
                    </div>
                    
                    <!-- NATIVE LOGIN BYPASS -->
                    <form id="custom-login-form" class="space-y-4">
                        <div>
                            <input type="email" id="email" required placeholder="Merchant Email" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white outline-none focus:border-gold-500">
                        </div>
                        <div>
                            <input type="password" required placeholder="Access Code" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white outline-none focus:border-gold-500" value="admin123">
                        </div>
                        <button type="submit" id="login-submit-btn" class="w-full bg-gold-500 hover:bg-gold-400 text-royal-900 font-bold py-3 rounded-lg transition-colors mt-4">Authenticate Empire</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden flex-grow flex-col relative z-10 min-h-screen bg-royal-900">
        <nav class="glass-card border-b border-white/10 px-6 py-4 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="text-2xl font-serif font-bold text-gold-400">BulkOrderBuddy</div>
                <div class="flex gap-4">
                    <span id="user-display" class="text-sm text-slate-300 flex items-center"></span>
                    <button id="logout-btn" class="bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white px-4 py-1.5 rounded text-sm transition-colors">Disconnect</button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-8 p-6 mt-8">
            <!-- Navigation Sidebar -->
            <aside class="md:col-span-1">
                <div class="glass-panel rounded-xl p-4 space-y-2 sticky top-24">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-4 ml-2">Command Modules</p>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="orders">🛒 Bulk Ordering</button>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="tracking">🚚 Logistics Tracking</button>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="gst">🧾 GST Invoicing</button>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="otp">🔐 OTP Gate</button>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="coupons">🎟️ Promo Engine</button>
                    <button class="nav-item w-full text-left px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 transition-colors font-medium" data-target="refunds">💰 Refund Monitor</button>
                </div>
            </aside>
            
            <!-- Dynamic Content Area -->
            <main class="md:col-span-3">
                <div id="module-container"></div>
            </main>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
